    <script>
      // Capture errors thrown before the app's error overlay module has loaded.
      window.__bootErrors = [];
      window.addEventListener('error', function (e) { window.__bootErrors.push({ message: String(e.message), stack: e.error && e.error.stack }); });
      window.addEventListener('unhandledrejection', function (e) { window.__bootErrors.push({ message: String(e.reason && e.reason.message || e.reason), stack: e.reason && e.reason.stack }); });
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"><div id="loading">Loading…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
